# eosinabox.com: the wallet is static files. TLS is added by certbot once DNS points here:
#   sudo certbot --nginx -d eosinabox.com -d www.eosinabox.com
# Account creation is slow and scarce by design: a few requests a minute per address.
limit_req_zone $binary_remote_addr zone=eosinabox_api:10m rate=12r/m;
limit_req_zone $binary_remote_addr zone=eosinabox_chain:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name eosinabox.com www.eosinabox.com;

    # One origin only: keys and stored accounts belong to eosinabox.com, not www.
    if ($host = www.eosinabox.com) {
        return 301 https://eosinabox.com$request_uri;
    }

    root /var/www/eosinabox.com;
    index index.html;

    # A wallet must not run stale code: let browsers revalidate everything.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Google sign-in learns the page origin from the referrer, so the origin (never the path) is sent.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The demo chain's API on the wallet's own origin, so the browser needs no cross-origin access.
    location /chain/ {
        limit_req zone=eosinabox_chain burst=60 nodelay;
        client_max_body_size 64k;
        proxy_pass http://127.0.0.1:8888/;
        proxy_hide_header Access-Control-Allow-Origin;
    }

    # The demo account service (see service/ and infra/eosinabox-accounts.service).
    location /api/ {
        limit_req zone=eosinabox_api burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
}
