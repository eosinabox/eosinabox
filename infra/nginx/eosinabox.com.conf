# eosinabox.com: the wallet is static files. TLS is added by certbot once DNS points here:
#   sudo certbot --nginx -d eosinabox.com -d www.eosinabox.com
server {
    listen 80;
    listen [::]:80;
    server_name eosinabox.com www.eosinabox.com;

    root /var/www/eosinabox.com;
    index index.html;

    # A wallet must not run stale code: let browsers revalidate everything.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
