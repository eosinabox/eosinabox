# eosinabox.com: the wallet is static files. TLS is added by certbot once DNS points here:
#   sudo certbot --nginx -d eosinabox.com -d www.eosinabox.com
# Account creation is slow and scarce by design: a few requests a minute per address.
limit_req_zone $binary_remote_addr zone=eosinabox_api:10m rate=12r/m;

server {
    listen 80;
    listen [::]:80;
    server_name eosinabox.com www.eosinabox.com;

    root /var/www/eosinabox.com;
    index index.html;

    # A wallet must not run stale code: let browsers revalidate everything.
    add_header Cache-Control "no-cache" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The demo account service (see service/ and infra/eosinabox-accounts.service).
    location /api/ {
        limit_req zone=eosinabox_api burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
    }
}
